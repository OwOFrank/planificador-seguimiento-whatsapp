<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento WhatsApp</title><style>
:root{font-family:system-ui,sans-serif;color:#172b22;background:#f3f7f4}body{margin:0}.wrap{max-width:900px;margin:auto;padding:32px 18px}h1{margin-bottom:4px}.sub{color:#53645b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;background:#fff;padding:18px;border-radius:14px;box-shadow:0 8px 25px #1d493015}label{display:grid;gap:6px;font-weight:650}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #b8c8bd;border-radius:8px}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}button{background:#16864c;color:#fff;border:0;font-weight:750;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}.card{background:#fff;border-radius:13px;padding:17px;border-left:5px solid #16864c;box-shadow:0 5px 16px #1d493010}.when{font-size:.9rem;color:#16864c;font-weight:750}.copy{margin-top:12px;background:#edf6f0;color:#126a3c}.empty{padding:22px;color:#617168;background:#fff;border-radius:12px}.note{font-size:.9rem;color:#5c6c62;margin-top:20px}</style></head>
<body><main class="wrap"><h1>Planificador de seguimiento por WhatsApp</h1><p class="sub">Convierte una venta pendiente en mensajes claros. Todo se queda en tu navegador.</p>
<section class="grid"><label>Nombre del cliente<input id="name" placeholder="Ej. Ana"></label><label>Servicio o propuesta<input id="offer" placeholder="Ej. sesión de fotos"></label><label>Estado<select id="stage"><option value="interes">Mostró interés</option><option value="cotizacion">Recibió cotización</option><option value="silencio">Dejó de responder</option><option value="reserva">Pidió reservar</option></select></label><label class="full">Detalle útil (opcional)<textarea id="detail" placeholder="Ej. fecha que quería, presupuesto, objeción o siguiente paso"></textarea></label><button class="full" id="make">Crear secuencia de 3 seguimientos</button></section>
<section id="result" class="empty" aria-live="polite">Completa los datos y genera una secuencia.</section><p class="note">Consejo: personaliza una línea con un dato real antes de enviar. No automatices mensajes sin consentimiento.</p></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sequence(n,o,stage,d){const x=d?` Vi que mencionaste ${d}.`:''; const a={
interes:[`Hola ${n}, ¿cómo vas? Te escribo porque me quedé pensando en ${o}.${x} Si te sirve, te explico en 2 minutos cómo sería el siguiente paso.`,`Hola ${n}, solo paso a dejarte una idea: puedo adaptar ${o} a lo que necesitas sin complicarte. ¿Te va bien que te mande una opción concreta?`,`Cierro el hilo por ahora para no llenarte de mensajes. Si ${o} vuelve a ser prioridad, escríbeme “info” y te retomo el tema.`],
cotizacion:[`Hola ${n}, ¿pudiste revisar la propuesta de ${o}?${x} Si hay algo que no encaje, dime cuál y la ajustamos.`,`${n}, para facilitarte la decisión: puedo resumirte alcance, fecha y precio en un solo mensaje. ¿Qué parte quieres confirmar primero?`,`Dejo la cotización abierta hasta que me digas. Si ya no lo necesitas también me ayuda saberlo para liberar agenda.`,],
silencio:[`Hola ${n}, retomo esto por si el mensaje se perdió. ¿Sigues buscando ${o}?${x}`,`No quiero insistir de más: ¿prefieres que te envíe una alternativa más simple para ${o} o lo dejamos para otro momento?`,`Cierro el seguimiento aquí. Cuando quieras volver a ${o}, con gusto retomamos desde donde quedamos.`],
reserva:[`Hola ${n}, para apartar ${o} solo necesito confirmar el día y tus datos básicos.${x} ¿Te propongo dos horarios?`,`${n}, tengo pendiente tu reserva. Si todavía te interesa, hoy puedo dejarla preapartada mientras confirmamos el pago o anticipo.`,`Como no tuve respuesta, libero el espacio para no bloquearte. Si aún lo necesitas, dime y reviso la siguiente disponibilidad.`]};return a[stage]}
$('make').onclick=()=>{const n=$('name').value.trim()||'hola';const o=$('offer').value.trim()||'tu servicio';const messages=sequence(n,o,$('stage').value,$('detail').value.trim());$('result').className='cards';$('result').innerHTML=messages.map((m,i)=>`<article class="card"><div class="when">${['Hoy','En 2 días','En 5–7 días'][i]}</div><div>${esc(m)}</div><button class="copy" data-m="${encodeURIComponent(m)}">Copiar mensaje</button></article>`).join('');document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(decodeURIComponent(b.dataset.m));b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar mensaje',1200)})}
</script></body></html>
